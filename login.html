<!doctype html>
<html lang="pt-BR" data-theme="light" data-brand="sasi" data-style="standard">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Cidade na Mão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/base.css">
  <style>
    :root { --login-side: var(--brand-900); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg-canvas, #fafafa); color: var(--fg-default); }
    .login { display: grid; grid-template-columns: minmax(0, 43fr) minmax(0, 57fr); min-height: 100vh; min-height: 100dvh; }

    /* Lado ilustrado */
    .side { position: relative; overflow: hidden; background: var(--login-side); color: #fff; }
    .side .brand { position: absolute; top: 32px; left: 32px; display: flex; align-items: center; gap: 10px; font-weight: 600; opacity: .9; }
    .mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.12); font-size: 13px; font-weight: 700; letter-spacing: .02em; }
    .side svg { position: absolute; left: 22px; bottom: 24px; width: 264px; height: auto; }
    .side .pulse { transform-origin: 68px 196px; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .side .pulse { animation: none; } }

    /* Formulário */
    .main { display: grid; place-items: center; padding: 48px 24px; }
    .form { width: 100%; max-width: 540px; }
    .m-brand { display: none; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 32px; color: var(--fg-default); }
    .m-brand .mark { background: var(--login-side); color: #fff; }
    h1 { margin: 0; font-size: 32px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; color: var(--login-side); }
    [data-theme="dark"] h1 { color: var(--fg-default); }
    .sub { margin: 4px 0 28px; font-size: 16px; color: var(--fg-muted); }
    .field { margin-bottom: 20px; }
    .field label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: var(--fg-default); }
    .field label b { color: var(--fg-danger, #c0262d); font-weight: 600; }
    .control { position: relative; display: flex; align-items: center; }
    .control input {
      width: 100%; height: 48px; padding: 0 16px; font: inherit; font-size: 15px;
      color: var(--fg-default); background: var(--bg-subtle, #f1f2f8);
      border: 1px solid var(--border-default, #d6d8e4); border-radius: 6px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .control input::placeholder { color: var(--fg-default); opacity: .85; }
    .control input:focus { border-color: var(--brand-600, var(--login-side)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-500, #4f46e5) 22%, transparent); }
    .control.pw input { padding-right: 92px; }
    .control.pw input::-ms-reveal { display: none; }
    .icons { position: absolute; right: 10px; display: flex; gap: 4px; }
    .icon-btn { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--fg-default); cursor: pointer; }
    .icon-btn:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
    .icon-btn:focus-visible { outline: 2px solid var(--brand-500, #4f46e5); outline-offset: 1px; }
    .icon-btn[hidden] { display: none; }
    .field.invalid input { border-color: var(--fg-danger, #c0262d); }
    .err { display: none; margin-top: 6px; font-size: 13px; color: var(--fg-danger, #c0262d); }
    .field.invalid .err { display: block; }
    .forgot { display: flex; justify-content: flex-end; margin: -10px 0 28px; }
    .forgot a { font-size: 14px; font-weight: 500; color: var(--fg-default); text-decoration: none; }
    .forgot a:hover { text-decoration: underline; }
    .submit {
      width: 100%; height: 56px; border: 0; border-radius: 6px; font: inherit; font-size: 16px; font-weight: 500;
      color: #fff; background: var(--login-side); cursor: pointer; transition: filter .15s;
    }
    .submit:hover { filter: brightness(1.25); }
    .submit:focus-visible { outline: 3px solid var(--brand-400, #818cf8); outline-offset: 2px; }
    .submit[disabled] { cursor: progress; filter: brightness(1.4); }
    .hint { margin-top: 20px; font-size: 13px; color: var(--fg-muted); text-align: center; }
    .note { display: none; margin-bottom: 20px; padding: 10px 14px; border-radius: 6px; font-size: 14px; background: var(--bg-subtle, #f1f2f8); color: var(--fg-default); }
    .note.show { display: block; }

    @media (max-width: 860px) {
      .login { grid-template-columns: 1fr; }
      .side { display: none; }
      .main { place-items: start center; padding: 40px 16px; }
      .m-brand { display: flex; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="login">
    <aside class="side" aria-hidden="true">
      <div class="brand"><span class="mark">CM</span><span>Cidade na Mão</span></div>
      <svg viewBox="0 0 264 264" fill="none">
        <path d="M80 30 A154 154 0 0 1 234 184" stroke="rgba(255,255,255,.32)" stroke-width="34" stroke-linecap="round"/>
        <path d="M76 94 A96 96 0 0 1 172 190" stroke="rgba(255,255,255,.32)" stroke-width="34" stroke-linecap="round"/>
        <circle cx="68" cy="196" r="58" fill="rgba(255,255,255,.32)"/>
        <circle class="pulse" cx="68" cy="196" r="50" fill="#5a1d2b"/>
      </svg>
    </aside>

    <main class="main">
      <form class="form" id="form" novalidate>
        <div class="m-brand"><span class="mark">CM</span><span>Cidade na Mão</span></div>
        <h1>Bem-vindo ao Cidade na Mão</h1>
        <p class="sub">Acesso da Prefeitura ao monitoramento de solicitações.</p>
        <div class="note" id="note" role="status"></div>

        <div class="field" id="fEmail">
          <label for="email">E-mail<b aria-hidden="true">*</b></label>
          <div class="control">
            <input id="email" name="email" type="email" list="contas" placeholder="Digite seu e-mail" autocomplete="username" required>
            <datalist id="contas">
              <option value="gestor@prefeitura.gov.br">
              <option value="atendimento@prefeitura.gov.br">
              <option value="defesacivil@prefeitura.gov.br">
            </datalist>
          </div>
          <div class="err" id="emailErr">Informe um e-mail válido.</div>
        </div>

        <div class="field" id="fPw">
          <label for="senha">Senha<b aria-hidden="true">*</b></label>
          <div class="control pw">
            <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            <div class="icons">
              <button type="button" class="icon-btn" id="clearPw" aria-label="Limpar senha" hidden>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></svg>
              </button>
              <button type="button" class="icon-btn" id="togglePw" aria-label="Mostrar senha" aria-pressed="false">
                <svg id="eyeOff" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-2.3 3.2M6.6 6.6C3.9 8.4 2.5 12 2.5 12S6 19 12 19a9 9 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg>
                <svg id="eyeOn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="err" id="pwErr">Informe sua senha.</div>
        </div>

        <div class="forgot"><a href="#" id="forgot">Esqueceu a senha?</a></div>

        <button type="submit" class="submit" id="submit">Entrar</button>
        <p class="hint">Demonstração: qualquer e-mail e senha dão acesso.</p>
      </form>
    </main>
  </div>

  <script>
    (() => {
      const $ = s => document.querySelector(s);
      const email = $('#email'), senha = $('#senha');
      try { if (sessionStorage.getItem('cnm:auth')) location.replace('index.html'); } catch {}

      const syncClear = () => { $('#clearPw').hidden = !senha.value; };
      senha.addEventListener('input', () => { syncClear(); $('#fPw').classList.remove('invalid'); });
      email.addEventListener('input', () => $('#fEmail').classList.remove('invalid'));
      $('#clearPw').onclick = () => { senha.value = ''; syncClear(); senha.focus(); };
      $('#togglePw').onclick = () => {
        const show = senha.type === 'password';
        senha.type = show ? 'text' : 'password';
        $('#eyeOn').hidden = !show; $('#eyeOff').hidden = show;
        $('#togglePw').setAttribute('aria-pressed', show);
        $('#togglePw').setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
      };
      $('#forgot').onclick = e => {
        e.preventDefault();
        const n = $('#note');
        n.textContent = email.value ? `Enviamos as instruções para ${email.value}.` : 'Digite seu e-mail para receber as instruções de recuperação.';
        n.classList.add('show');
        if (!email.value) email.focus();
      };

      $('#form').onsubmit = e => {
        e.preventDefault();
        const okEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
        const okPw = senha.value.length > 0;
        $('#fEmail').classList.toggle('invalid', !okEmail);
        $('#fPw').classList.toggle('invalid', !okPw);
        if (!okEmail) return email.focus();
        if (!okPw) return senha.focus();
        const btn = $('#submit');
        btn.disabled = true; btn.textContent = 'Entrando…';
        try { sessionStorage.setItem('cnm:auth', JSON.stringify({ email: email.value.trim(), at: Date.now() })); } catch {}
        setTimeout(() => location.replace('index.html'), 500);
      };
    })();
  </script>
</body>
</html>
